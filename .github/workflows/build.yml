name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Chuan bi ma nguon
        run: |
          rm -rf src_build && mkdir src_build
          unzip -q project.zip -d src_build
          test -f google-services.json
          cp google-services.json src_build/app/google-services.json
      - name: Build
        working-directory: src_build
        run: gradle assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Nest-APK
          path: src_build/app/build/outputs/apk/release/*.apk
