name: Build APK

on:
workflow_dispatch:
push:
branches: [main, master]

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Check project files
    run: |
      ls -la
      test -f settings.gradle || test -f settings.gradle.kts
      test -d app

  - name: Configure Google Services
    run: |
      test -f google-services.json
      mkdir -p app
      cp google-services.json app/google-services.json

  - name: Build APK
    run: gradle assembleRelease --no-daemon --stacktrace

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Nest-APK
      path: app/build/outputs/apk/release/*.apk
      if-no-files-found: error
