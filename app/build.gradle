plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Có thể đổi bằng: gradle assembleDebug -PappVersionName=1.2.0 -PabiList=arm64-v8a
def vCode = (project.findProperty('appVersionCode') ?: '1').toString().toInteger()
def vName = (project.findProperty('appVersionName') ?: '1.1.0').toString()
def abiList = (project.findProperty('abiList') ?: 'arm64-v8a,armeabi-v7a').toString().split(',').collect { it.trim() }.findAll { it }

android {
    namespace 'com.mcbot.manager'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mcbot.manager'
        minSdk 24
        targetSdk 34
        versionCode vCode
        versionName vName
        buildConfigField 'String', 'PROJECT_STAMP', "\"${System.currentTimeMillis()}\""
        ndk { abiFilters.addAll(abiList) }
        externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DANDROID_STL=c++_shared' } }
    }

    // Khóa ký cố định -> cài đè bản mới lên bản cũ được, không mất dữ liệu
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildFeatures { buildConfig true }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main { jniLibs.srcDir 'libnode/bin' }
    }

    // nén libnode.so trong APK cho nhỏ, giải nén khi cài
    packaging { jniLibs { useLegacyPackaging = true } }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
